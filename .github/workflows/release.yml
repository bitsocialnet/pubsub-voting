name: Release
on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [master]

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # release-it's version bump rewrites package-lock.json with whatever npm this job
      # has (see the before:git:release hook in config/.release-it.json), so it must match
      # the npm CI uses or every release desyncs the lockfile and breaks `npm ci` on
      # master. Keep in sync with ci.yml.
      - run: npm i -g npm@11.13.0

      - run: npm ci
      - run: npm run build

      - name: Set up Git author
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Get current version
        id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Run release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release -- --ci || true

      - name: Check if released
        id: release
        run: |
          AFTER=$(node -p "require('./package.json').version")
          if [ "${{ steps.before.outputs.version }}" != "$AFTER" ]; then
            echo "Released v$AFTER"
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "No new version to release"
            echo "released=false" >> $GITHUB_OUTPUT
          fi

      # npm@11 pinned: npm 12 has a sigstore MODULE_NOT_FOUND bug that breaks --provenance
      - name: Publish to npm
        if: steps.release.outputs.released == 'true'
        run: npx --yes npm@11 publish --access public --provenance
